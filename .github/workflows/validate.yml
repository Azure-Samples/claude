name: validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bicep:
    name: Bicep build + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Bicep CLI
        run: |
          curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x bicep
          sudo mv bicep /usr/local/bin/bicep
          bicep --version
      - name: bicep build (main.bicep)
        run: bicep build infra-bicep/infra/main.bicep --outfile /tmp/main.json
      - name: bicep build (foundry.bicep)
        run: bicep build infra-bicep/infra/foundry.bicep --outfile /tmp/foundry.json
      - name: bicep lint
        run: |
          bicep lint infra-bicep/infra/main.bicep
          bicep lint infra-bicep/infra/foundry.bicep

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra-terraform/infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.10.0"
          terraform_wrapper: false
      - name: terraform fmt -check
        run: terraform fmt -check -recursive
      - name: terraform init (backend=false)
        run: terraform init -backend=false
      - name: terraform validate
        run: terraform validate -no-color

  python:
    name: Python tests + compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Byte-compile all sample scripts
        run: python -m compileall -q src/
      - name: Run offline SDK, catalog, and preflight regression tests
        run: python -m unittest discover -s tests -v

  typescript:
    name: TypeScript SDK sample
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samples/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: samples/typescript/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  go:
    name: Go SDK sample
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: samples/go/go.mod
          cache-dependency-path: samples/go/go.sum
      - run: go vet ./...
        working-directory: samples/go
      - run: go test ./...
        working-directory: samples/go

  dotnet:
    name: C# SDK sample
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test samples/dotnet/AnthropicStandardSdk.sln --configuration Release

  java:
    name: Java SDK sample
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: samples/java/pom.xml
      - run: mvn --batch-mode test
        working-directory: samples/java

  php:
    name: PHP SDK sample
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
        working-directory: samples/php
      - run: composer test
        working-directory: samples/php

  ruby:
    name: Ruby SDK sample
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: samples/ruby
      - run: bundle exec ruby test/run.rb
        working-directory: samples/ruby

  shell:
    name: Shellcheck + PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck on *.sh
        run: |
          mapfile -d '' files < <(git ls-files -z '*.sh')
          if [ "${#files[@]}" -eq 0 ]; then echo "No .sh files."; exit 0; fi
          shellcheck --severity=error "${files[@]}"
      - name: Run PSScriptAnalyzer on *.ps1
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          $files = Get-ChildItem -Recurse -Include *.ps1 -Path . |
            Where-Object { $_.FullName -notmatch '[\\/]\.venv[\\/]|[\\/]\.git[\\/]|[\\/]\.terraform[\\/]' }
          if (-not $files) { Write-Host "No .ps1 files to scan."; exit 0 }
          $issues = $files | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_.FullName -Severity Error `
              -ExcludeRule PSAvoidUsingWriteHost,PSUseDeclaredVarsMoreThanAssignments
          }
          if ($issues) { $issues | Format-Table -AutoSize; exit 1 } else { Write-Host "No errors." }
